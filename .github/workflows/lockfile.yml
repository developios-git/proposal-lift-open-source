# Fails when the committed package-lock.json can't be installed by the npm
# versions self-hosters actually run:
#
#   - Node 22 and Node 24 with their bundled npm (what local installs and
#     Vercel use)
#   - the newest npm, as early warning before users upgrade to it
#   - the Docker image's own dependency stage (what `docker compose up --build`
#     runs)
#
# Some npm 11 releases rewrite the lockfile without the @emnapi WASM fallback
# entries. The npm that wrote it installs fine; the others reject it. A lockfile
# like that fails here instead of on someone else's machine.
name: Lockfile

on:
  push:
    branches: [main]
    paths:
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/lockfile.yml
  pull_request:
    paths:
      - package.json
      - package-lock.json
      - Dockerfile
      - .github/workflows/lockfile.yml

permissions:
  contents: read

jobs:
  npm-ci:
    name: npm ci (Node ${{ matrix.node }}, npm ${{ matrix.npm }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: 22
            npm: bundled
          - node: 24
            npm: bundled
          - node: 24
            npm: latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install npm@latest
        if: matrix.npm == 'latest'
        run: npm install -g npm@latest

      - name: npm ci
        run: |
          npm --version
          npm ci --ignore-scripts --no-audit --no-fund

  docker-deps:
    name: Docker dependency stage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies exactly as the Docker image does
        run: docker build --target deps .
